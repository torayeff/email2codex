[project]
name = "email2codex"
version = "0.1.0"
description = "Email router for the system-installed Codex CLI via AgentMail"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "agentmail>=2.0.4",
    "python-dotenv>=1.2.3",
]

[project.scripts]
email2codex = "email2codex:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["email2codex.py"]
